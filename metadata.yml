Title: Antimicrobial class specificity prediction
Description: "Predicts which broad class of organism a compound is likely to act against, separating Gram-positive and Gram-negative bacteria from fungi rather than predicting potency against one strain. Gadiya and colleagues trained the classifier on curated antimicrobial activity spanning multiple pathogen types, addressing a practical triage question early in discovery. Class probabilities are reported independently, so a compound may score highly for more than one, reflecting genuine broad-spectrum potential."
