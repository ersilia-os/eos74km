Status: Ready
Title: Antimicrobial class specificity prediction
Description: Sorts a compound into one of five antimicrobial outcomes, activity against
  Gram-positive, Gram-negative or acid-fast bacteria, activity against fungi, or no
  antimicrobial activity, answering a triage question rather than predicting potency
  against one strain. Gadiya and colleagues assembled AntiMicrobial-KG, a knowledge
  graph of public in vitro MIC data from ChEMBL, CO-ADD and SPARK spanning 81,490
  compounds, and found a random forest on MHFP6 fingerprints best, at 75.9% accuracy
  and a Cohen's kappa of 0.68. Predictions were checked against screens of the EU-OS
  compound libraries.
